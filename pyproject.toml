[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datathon-7mlet"
version = "0.1.0"
description = "Datathon 7-MLET: Adaptive Experimentation in Financial Offers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "redis[hiredis]>=5.2",
    "aiokafka>=0.11",
    "mlflow>=2.18",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "openai>=1.55",
    "clickhouse-driver>=0.2.9",
    "boto3>=1.35",
    "httpx>=0.28",
    "rich>=13.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
    # RAG stack (local)
    "llama-index-core>=0.12",
    "llama-index-vector-stores-qdrant>=0.4",
    "llama-index-embeddings-openai>=0.3",
    "qdrant-client>=1.9",
    # Azure SDK (used when AZURE_* env vars are set — Container Apps deploy)
    "azure-identity>=1.17",
    "azure-search-documents>=11.6",
    "azure-kusto-data>=4.4",
    "llama-index-vector-stores-azureaisearch>=0.3",
    "llama-index-embeddings-azure-openai>=0.3",
    "langfuse>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
    "mypy>=1.13",
    "locust>=2.32",
    "nbmake>=1.5",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "jupyter>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B"]
ignore = ["S101", "S311", "S106", "B008", "N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: tests that require the Docker Compose stack to be running",
]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]
